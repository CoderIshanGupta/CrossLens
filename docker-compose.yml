services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: crosslens-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: crosslens-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Quiet down internal group rebalance logging in Docker Desktop
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.coordinator.group=WARN,kafka.log.LogCleaner=WARN"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crosslens-backend
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crosslens-worker
    restart: unless-stopped
    depends_on:
      - kafka
      - backend
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    command: python worker_comparison.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crosslens-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"